# 百工 QA —— qa 分支：测试验证 + 试用包流水线。
# 三分支分工：
#   develop → ci.yml：门禁；
#   qa      → 本文件：门禁复跑 + 产出测试侧可用的试用制品；
#   main    → release.yml：正式发布。
# 试用制品按仓库形态自动产出（兑现 GitLab CI 时期因缺 Windows runner 而搁置的打包计划）：
#   库类项目（有 package.json、无 src-tauri）→ qa-pack：npm pack 出 tgz，供 npm i <tgz> 试用；
#   Tauri 应用（有 src-tauri/tauri.conf.json）  → qa-app-windows：Windows NSIS/MSI 安装包；
#   文档脚手架仓库                            → 仅 docs-gate。

name: QA 流水线 (qa)

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    name: 前端门禁
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 门禁（check 优先，缺省 build）
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.check?0:1)"; then
            npm run check
          else
            npm run build
          fi
      - name: smoke（如存在）
        if: hashFiles('smoke/verify.mjs') != ''
        run: npm run smoke

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    if: hashFiles('src-tauri/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  docs-gate:
    name: 文档仓库占位门禁
    runs-on: ubuntu-latest
    if: hashFiles('package.json') == ''
    steps:
      - uses: actions/checkout@v4
      - name: 结构完整性检查
        run: |
          test -f README.md
          echo "文档阶段仓库：暂无代码门禁，仅确认结构完整。"

  qa-pack:
    name: QA 试用包 (tgz)
    needs: [web-gate]
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != '' && hashFiles('src-tauri/Cargo.toml') == ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build --if-present
      - name: npm pack
        run: npm pack --pack-destination .
      - name: 上传试用包
        uses: actions/upload-artifact@v4
        with:
          name: qa-tgz
          path: ./*.tgz
          retention-days: 14

  qa-app-windows:
    name: QA 试用安装包 (Windows)
    needs: [web-gate, rust-gate]
    runs-on: windows-latest
    if: hashFiles('src-tauri/tauri.conf.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: npm ci
      - name: 构建 Tauri 安装包
        run: npm run tauri build
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: warn
