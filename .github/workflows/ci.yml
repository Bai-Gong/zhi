# 百工 CI —— develop 分支：日常开发门禁流水线。
# 三分支分工：
#   develop → 本文件：push 到 develop 或 MR 目标为 develop/qa/main 时跑门禁；
#   qa      → qa.yml：门禁 + 试用包（tgz / Windows 安装包）；
#   main    → release.yml：门禁 + 正式发布（tag + GitHub Release）。
# 说明：由 GitLab CI 迁移而来。作业按仓库形态自动生效——
#   有 package.json      → web-gate（check 优先，缺省 build；有 smoke 再跑 smoke）
#   有 src-tauri/        → rust-gate（cargo check --locked，与本地门禁同链）
#   仅有文档的脚手架仓库  → docs-gate（结构占位检查）

name: CI 门禁 (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    name: 前端门禁
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 门禁（check 优先，缺省 build）
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.check?0:1)"; then
            npm run check
          else
            npm run build
          fi
      - name: smoke（如存在）
        if: hashFiles('smoke/verify.mjs') != ''
        run: npm run smoke
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: ignore

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    if: hashFiles('src-tauri/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  docs-gate:
    name: 文档仓库占位门禁
    runs-on: ubuntu-latest
    if: hashFiles('package.json') == ''
    steps:
      - uses: actions/checkout@v4
      - name: 结构完整性检查
        run: |
          test -f README.md
          echo "文档阶段仓库：暂无代码门禁，仅确认结构完整。"
