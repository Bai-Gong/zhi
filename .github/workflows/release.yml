# 百工·纸发布 —— main 分支：门禁复跑 + Windows 正式安装包 + GitHub Release。
# 兑现 GitLab CI 时期因缺 Windows runner 而搁置的打包计划（main 出正式包）。
# Release 以 tauri.conf.json 的版本号打 tag（v{version}）；
# 每次正式发布前请先在 main 上提升版本号，未提升时将更新同名 Release。

name: 发布流水线 (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-gate:
    name: 前端门禁 (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  release-app-windows:
    name: 正式发布 (Windows 安装包 + Release)
    needs: [web-gate, rust-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: npm ci
      # 只产 NSIS 安装包：WiX(MSI) 的 codepage 1252 无法编码中文产品名"百工纸"（LGHT0311）
      - name: 构建 Tauri 安装包
        run: npm run tauri build -- --bundles nsis
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ github.event.repository.name }} v${{ steps.ver.outputs.version }}
          body: |
            正式发布（由 main 分支流水线自动生成）。
            发布前请确认已在 main 上提升 tauri.conf.json 版本号。
          files: src-tauri/target/release/bundle/nsis/*.exe
