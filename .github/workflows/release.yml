# 百工发布 —— main 分支：正式发布流水线。
# 三分支分工：
#   develop → ci.yml：门禁；
#   qa      → qa.yml：门禁 + 试用包；
#   main    → 本文件：门禁复跑 + 打 tag 创建 GitHub Release 附正式制品。
# 正式制品按仓库形态自动产出：
#   库类项目 → release-lib：npm pack 出正式 tgz 并附到 Release；
#   Tauri 应用 → release-app-windows：Windows NSIS/MSI 正式安装包附到 Release；
#   文档脚手架仓库 → 仅过 docs-gate，正式发布随代码落地后再启用。
# 注意：Release 以 package.json / tauri.conf.json 的版本号打 tag（v{version}），
#   每次正式发布前请先在 main 上提升版本号；未提升时将更新同名 Release。

name: 发布流水线 (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-gate:
    name: 前端门禁
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 门禁（check 优先，缺省 build）
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.check?0:1)"; then
            npm run check
          else
            npm run build
          fi
      - name: smoke（如存在）
        if: hashFiles('smoke/verify.mjs') != ''
        run: npm run smoke

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    if: hashFiles('src-tauri/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  docs-gate:
    name: 文档仓库占位门禁
    runs-on: ubuntu-latest
    if: hashFiles('package.json') == ''
    steps:
      - uses: actions/checkout@v4
      - name: 结构完整性检查
        run: |
          test -f README.md
          echo "文档阶段仓库：暂无代码门禁，正式发布随代码落地后再启用。"

  release-lib:
    name: 正式发布 (tgz + Release)
    needs: [web-gate]
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != '' && hashFiles('src-tauri/Cargo.toml') == ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build --if-present
      - name: npm pack
        run: npm pack --pack-destination .
      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ github.event.repository.name }} v${{ steps.ver.outputs.version }}
          body: |
            正式发布（由 main 分支流水线自动生成）。
            发布前请确认已在 main 上提升 package.json 版本号。
          files: ./*.tgz

  release-app-windows:
    name: 正式发布 (Windows 安装包 + Release)
    needs: [web-gate, rust-gate]
    runs-on: windows-latest
    if: hashFiles('src-tauri/tauri.conf.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: npm ci
      - name: 构建 Tauri 安装包
        run: npm run tauri build
      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ github.event.repository.name }} v${{ steps.ver.outputs.version }}
          body: |
            正式发布（由 main 分支流水线自动生成）。
            发布前请确认已在 main 上提升 tauri.conf.json 版本号。
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
