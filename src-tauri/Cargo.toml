[package]
name = "zhi"
version = "0.1.0"
description = "百工·纸 — PDF/文档处理工具"
authors = ["guyuemochen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may necessary to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zhi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：启用 tauri.conf.json 的 assetProtocol（convertFileSrc 主路径）所必需，
# 缺失时 tauri-build 校验失败（cargo check 实测）。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"


# 本机 Kaspersky 会拦截默认参数编译出的 tauri-plugin-dialog 构建脚本二进制（os error 32/5，
# 按内容缓存的判定，确定性构建导致每次必中）。改 build-override 参数即改变二进制内容，
# 实测绕开判定（jian 仓库同款先例，2026-10-19）。若再被盯上，微调本节参数即可。
[profile.dev.build-override]
opt-level = 1
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
