# 百工·纸 GitLab CI —— 仅 develop / qa 的门禁流水线。
# 刻意范围（与坊 fang 同一决策口径）：
#   ① push 到 main 不设流水线，正式打包整体推迟；
#   ② Windows 安装包（NSIS/MSI）暂不产出——实例当前仅有 Linux docker runner，
#      在其上 tauri build 得到 .deb/.AppImage 对 Windows 侧 QA 无意义；
#      待配备 Windows runner 后再于 qa（试用包）/ main（正式包）补打包作业；
#   ③ qa 与 develop 跑同一套门禁（本地同链：npm run build + cargo check），
#      分支差异化靠 GitLab 保护分支合并校验承担，不在 YAML 里做区分。
# 事实依据：cargo check 已实测不依赖前端 dist/（tauri-codegen 在 check 阶段
# 不要求 asset 目录在场），故两个门禁作业可完全并行、互不传产物。

stages:
  - gate

workflow:
  rules:
    # push 流水线只认 develop / qa
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "qa"'
    # 目标为 develop / qa 的 MR 在合并 ref 上跑同一套门禁
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|qa)$/'

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # 从 rust 镜像默认的 /usr/local/cargo 挪进项目目录，registry 才能落 GitLab cache
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

# 前端门禁：tsc + vite build（与本地 `npm run build` 完全同链）。
web-gate:
  stage: gate
  image: node:22-bookworm-slim
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
  interruptible: true
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 3 days
    when: always

# Rust 门禁：cargo check（与本地 Rust 门禁同链）。
# Tauri 2 在 Linux 上即便只做 check，各 *-sys 依赖的 build script 也要经
# pkg-config 探到 webkit2gtk/gtk 等头文件与 .pc，故须先装系统依赖；
# bookworm 源内 webkit2gtk 即 4.1，与 Tauri 2 要求一致。
rust-gate:
  stage: gate
  image: rust:1-bookworm
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev
      libgtk-3-dev
      librsvg2-dev
      libxdo-dev
      libayatana-appindicator3-dev
      libssl-dev
      pkg-config
  cache:
    - key:
        files:
          - src-tauri/Cargo.lock
      paths:
        - .cargo-home/registry/
        - src-tauri/target/
  interruptible: true
  script:
    - cargo check --manifest-path src-tauri/Cargo.toml --locked
